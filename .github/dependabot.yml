# Dependabot keeps the app's Rust crates and CI actions current, the same
# way it does for the privacy kernel. Its pull requests go through the
# normal CI and review; a bump that needs code changes is fixed on
# Dependabot's own branch, not closed and redone.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # html5ever and markup5ever share one version line; our own DOM
      # (aux-runtime fetch/dom.rs) replaced markup5ever_rcdom in #78. The
      # rcdom pattern stays only for the kernel's leftover edge until the
      # next kernel release drops it.
      html-parser:
        patterns:
          - html5ever
          - markup5ever
          - markup5ever_rcdom
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
