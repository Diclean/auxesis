# Dependabot keeps the app's Rust crates and CI actions current, the same
# way it does for the privacy kernel. Its pull requests go through the
# normal CI and review; a bump that needs code changes is fixed on
# Dependabot's own branch, not closed and redone.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # html5ever and markup5ever_rcdom must share one markup5ever version,
      # so they move together or not at all.
      html-parser:
        patterns:
          - html5ever
          - markup5ever
          - markup5ever_rcdom
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
