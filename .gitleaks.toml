# Gitleaks configuration for the Auxesis tree.
#
#     gitleaks dir . --no-banner
#
# `gitleaks dir` finds this file in the tree; `--config .gitleaks.toml` names
# it explicitly. The default rule set is kept. The allowlist is path-only and
# names the synthetic fixture files already justified in
# scripts/secret-scan-allowlist.txt: a real credential must never be added to
# one of these paths, and a new fixture gets its exact path here, never a
# value regex.
#
# Every path is a full repo-relative regex anchored with ^...$: gitleaks
# applies these with MatchString, so an unanchored path would also allow a
# backup (`<path>.bak`) or the same suffix under another directory.
title = "Auxesis"

[extend]
useDefault = true

[allowlist]
description = "Synthetic secret fixtures reviewed in scripts/secret-scan-allowlist.txt"
paths = [
    # The fixture catalogue itself quotes the shapes it explains.
    '''^scripts/secret-scan-allowlist\.txt$''',

    # The shared redaction canary corpus.
    '''^test-support/redaction_canaries\.rs$''',

    # auxd: API and activity unit tests, and their integration fixtures.
    '''^crates/auxd/src/agent_job\.rs$''',
    '''^crates/auxd/src/api/approval\.rs$''',
    '''^crates/auxd/src/api/deltas\.rs$''',
    '''^crates/auxd/src/api/events\.rs$''',
    '''^crates/auxd/src/api/providers\.rs$''',
    '''^crates/auxd/src/api/receipt\.rs$''',
    '''^crates/auxd/src/api/snapshot\.rs$''',
    '''^crates/auxd/src/api/wire\.rs$''',
    '''^crates/auxd/tests/api\.rs$''',
    '''^crates/auxd/tests/b_api_3\.rs$''',
    '''^crates/auxd/tests/bapiv2_fix2_regression\.rs$''',
    '''^crates/auxd/tests/bapiv2_fix_regression\.rs$''',
    '''^crates/auxd/tests/firstrun_api\.rs$''',
    '''^crates/auxd/tests/private_turn\.rs$''',
    '''^crates/auxd/tests/ws_f1_streaming\.rs$''',

    # aux-acp: the fake agent and the scrub tests it feeds.
    '''^crates/aux-acp/src/bin/acp_fake_agent\.rs$''',
    '''^crates/aux-acp/src/scrub\.rs$''',
    '''^crates/aux-acp/src/supervisor\.rs$''',
    '''^crates/aux-acp/tests/acp_integration\.rs$''',
]
