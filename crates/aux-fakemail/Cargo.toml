[package]
name = "aux-fakemail"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Local simulated IMAP/SMTP mailbox for offline Auxesis development"
# A dev tool: never a dependency of auxd or aux-cli, never published.
publish = false

[lib]
name = "aux_fakemail"
path = "src/lib.rs"

[[bin]]
name = "aux-fakemail"
path = "src/bin/aux-fakemail.rs"

[dependencies]
# The fakes speak aux-mail's own wire types (`Security`, `Endpoint`,
# `AsyncReadWrite`, `Credentials`); this is the only crate edge that makes the
# in-process doubles usable outside aux-mail's test binary.
aux-mail = { path = "../aux-mail" }
clap.workspace = true
# The binary is a workspace binary target and calls the one shared guard.
kernel-core.workspace = true
# Self-signed certificates for the simulator's TLS listener.
rcgen.workspace = true
serde.workspace = true
serde_json = "1"
tokio = { workspace = true, features = ["net", "io-util", "time", "sync", "rt-multi-thread", "macros", "signal"] }
# The same rustls stack aux-mail dials with (`ring`, TLS 1.2 + 1.3).
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
    "logging",
] }

[dev-dependencies]
tempfile.workspace = true
