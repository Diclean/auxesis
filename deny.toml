[licenses.private]
# The private crates of this workspace (the ones with `publish = false`) are
# checked too: they carry the same licence as the published crates,
# including the in-tree `crates/aux-invoices`.
ignore = false

[bans]
multiple-versions = "warn"

[sources]
# crates.io plus exactly one git repository: the public privacy kernel pinned
# to tag v0.1.1. The invoices library (`crates/aux-invoices`) is an in-tree
# path dependency. Nothing broader.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/Diclean/auxesis-privacy-kernel"]
